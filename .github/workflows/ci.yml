name: CI

on:
  # No `branches:` filter: it matches the PR's base, so a stacked PR would get no checks
  # at all, and a required check that never runs leaves a clean-looking PR page.
  #
  # `edited` is in the list because retargeting a PR fires that and nothing else —
  # not `synchronize` — so without it, moving a stacked PR onto `main` still left it
  # unchecked. It also fires on title/body edits, which re-runs a ~40s job for no
  # reason; that is the accepted cost of the base-change signal, since GitHub has no
  # narrower event for it.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guards:
    name: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: No stray tracked files
        run: python3 tests/test_no_stray_files.py

      # `claude plugin validate` is blind to the marketplace top-level version: it exits
      # 0 on a stale or even deleted one. This is that gap.
      - name: Version numbers agree
        run: python3 tests/test_version_agreement.py

      # `setup upgrade` can only add a key it knows how to probe. This holds the
      # schema table, its example and setup's probe list to one key set.
      - name: Config schema agrees
        run: python3 tests/test_config_schema.py

      # Skills link to the owner of each fact instead of restating it. A link that
      # points at a moved file silently drops the rule from the run.
      - name: Relative links resolve
        run: python3 tests/test_links.py

      # Stack docs are read by header name; the skeleton, config.md's table and
      # every "§ <Section>" reference have to be one set.
      - name: Doc headers agree
        run: python3 tests/test_doc_headers.py

      - name: Plugin + marketplace manifests
        run: |
          npm i -g @anthropic-ai/claude-code
          claude plugin validate ./plugins/gh-issue-flow --strict
          claude plugin validate . --strict
