name: CI

on:
  # 🚨 NO `branches:` filter, deliberately. That filter matches the PR's BASE, so a
  # stacked PR — one opened against another branch rather than `main` — never ran
  # guards at all. MEASURED: PR #15 sat at zero checks while showing MERGEABLE, with
  # `guards` a REQUIRED check. A green-looking PR page with no checks on it is the
  # exact "silence reads as success" failure this repo's reference docs are about.
  #
  # `edited` is in the list because retargeting a PR fires that and nothing else —
  # not `synchronize` — so without it, moving a stacked PR onto `main` still left it
  # unchecked. It also fires on title/body edits, which re-runs a ~40s job for no
  # reason; that is the accepted cost of the base-change signal, since GitHub has no
  # narrower event for it.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guards:
    name: guards
    runs-on: ubuntu-latest
    steps:
      # The guard enumerates via `git ls-files`, so it needs real history, not
      # the shallow default — and it must see the MERGE of head with base, which
      # is what `pull_request` checks out. A duplicate introduced on main after
      # this branch forked still has to red here.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Single-owner facts
        run: python3 tests/test_single_owner_facts.py

      - name: No stray tracked files
        run: python3 tests/test_no_stray_files.py

      # `claude plugin validate` is blind to the marketplace top-level version —
      # measured: it exits 0 on a stale or even deleted one. This is that gap.
      - name: Version numbers agree
        run: python3 tests/test_version_agreement.py

      - name: Plugin + marketplace manifests
        run: |
          npm i -g @anthropic-ai/claude-code
          claude plugin validate ./plugins/gh-issue-flow --strict
          claude plugin validate . --strict
